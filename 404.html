<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080a40">
  <title>Página não encontrada | Professor Leonardo Andrade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080a40;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    main { width: 100%; max-width: 560px; text-align: center; }
    .brand { color: #b9f3d6; font-size: 14px; }
    .code { margin: 32px 0 12px; color: #18d97f; font-size: 72px; font-weight: bold; }
    h1 { margin: 0 0 16px; font-size: clamp(26px, 6vw, 36px); }
    .message { color: #e4e7ff; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 16px 24px;
      border-radius: 12px;
      background: #18d97f;
      color: #080a40;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { background: #b9f3d6; }
    a:focus-visible { outline: 3px solid #ffffff; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Professor Leonardo Andrade</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p class="message">Este endereço não existe ou foi alterado. Volte para a página inicial para conhecer o curso.</p>
    <a href="/">Voltar para o site</a>
  </main>
</body>
</html>
